<!DOCTYPE html>
{% load static %}
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar — Top criptos</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <main class="content">
        <section class="form-container">
            <h1>Entrar</h1>
            {% if form.errors %}
                <p role="alert">Usuário ou senha inválidos. Tente novamente.</p>
            {% endif %}
            {% if next %}
                <p>Entre para continuar.</p>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">
                {{ form.as_p }}
                <button type="submit">Entrar</button>
            </form>
            <p><a href="{% url 'index' %}">Voltar ao mapa de criptomoedas</a></p>
        </section>
    </main>
</body>
</html>
